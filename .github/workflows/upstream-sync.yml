name: Upstream VAFT Sync

on:
  schedule:
    - cron: "19 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-vaft-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update VAFT bundle
        run: ./scripts/update-vaft.sh

      - name: Detect bundle changes
        id: changes
        run: |
          if git diff --quiet -- extension/injected/vaft.js; then
            git checkout -- extension/injected/upstream.txt
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        id: bump
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION=$(node -e '
            const fs = require("fs");
            const path = "extension/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            const [major, minor, patch] = manifest.version.split(".").map((part) => parseInt(part, 10) || 0);
            manifest.version = `${major}.${minor}.${patch + 1}`;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
            process.stdout.write(manifest.version);
          ')
          ENGINE=$(grep '^version=' extension/injected/upstream.txt | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"

      - name: Build extension zip
        if: steps.changes.outputs.changed == 'true'
        run: ./scripts/build-zip.sh

      - name: Upload extension artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: twitch-ads-blocker-extension
          path: dist/twitch-ads-blocker-extension.zip

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "update vaft engine to ${{ steps.bump.outputs.engine }}"
          branch: "automation/update-vaft"
          delete-branch: true
          add-paths: |
            extension/injected/vaft.js
            extension/injected/upstream.txt
            extension/manifest.json
          title: "Update VAFT engine to ${{ steps.bump.outputs.engine }} (v${{ steps.bump.outputs.version }})"
          body: |
            Automated update generated by `.github/workflows/upstream-sync.yml`.

            Changes:
            - refresh `extension/injected/vaft.js` (engine ${{ steps.bump.outputs.engine }})
            - refresh `extension/injected/upstream.txt`
            - bump extension version to `${{ steps.bump.outputs.version }}`

            Merging this PR publishes release `v${{ steps.bump.outputs.version }}` automatically via `.github/workflows/auto-release.yml`.
