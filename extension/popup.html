<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NoBreak</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1><img src="icons/icon-32.png" alt="" width="20" height="20" />NoBreak</h1>

      <div id="updateBanner" class="banner update" hidden>
        <span id="updateText">Update available</span>
        <button id="updateBtn" type="button" class="link">Download</button>
      </div>

      <section class="stats">
        <p id="statsMain" class="stats-main">No ads blocked yet</p>
        <p id="statsSub" class="stats-sub">Blocked ad breaks will show up here.</p>
      </section>

      <label class="row" for="enabledToggle">
        <span>Ad Blocking</span>
        <input id="enabledToggle" type="checkbox" />
      </label>
      <label class="row" for="watchdogToggle">
        <span>Watchdog Recovery</span>
        <input id="watchdogToggle" type="checkbox" />
      </label>

      <p id="stateText" class="state"></p>
      <p id="engineVersion" class="meta">Engine version: loading...</p>
      <p id="conflictText" class="meta">Conflict check: waiting for Twitch tab data...</p>
      <p id="watchdogText" class="meta">Watchdog: waiting for Twitch tab data...</p>

      <button id="reloadBtn" type="button">Reload Twitch Tab</button>

      <div id="starCard" class="banner star" hidden>
        <p>Enjoying ad-free streams? A GitHub star helps other people find this.</p>
        <div class="banner-actions">
          <button id="starBtn" type="button">⭐ Star on GitHub</button>
          <button id="starDismissBtn" type="button" class="secondary">Not now</button>
        </div>
      </div>

      <footer class="footer">
        <button id="repoLink" type="button" class="link">GitHub</button>
        <span aria-hidden="true">·</span>
        <button id="issueLink" type="button" class="link">Report an issue</button>
        <span aria-hidden="true">·</span>
        <span id="extVersion"></span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
